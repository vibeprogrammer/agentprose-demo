name: Deploy Hugo site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Hugo (extended)
        run: |
          curl -sSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${{ env.HUGO_VERSION }}/hugo_extended_${{ env.HUGO_VERSION }}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo
          sudo mv hugo /usr/local/bin/hugo
          hugo version

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      # agentprose static index: metadata + full Markdown per post, read by the one-line script.
      # Same version as the vendored bundle in static/js/ (keep the two in step).
      - name: Build agentprose index
        run: npx --yes agentprose@0.1.6 build public --base-url "${{ steps.pages.outputs.base_url }}/" --include '^/posts/'

      - name: Check search-engine blocking
        run: |
          grep -q "Disallow: /" public/robots.txt
          missing=$(grep -L 'name=robots content="noindex, nofollow"' $(find public -name '*.html') || true)
          if [ -n "$missing" ]; then echo "Pages without noindex:"; echo "$missing"; exit 1; fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
