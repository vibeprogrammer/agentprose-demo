baseURL = "https://vibeprogrammer.github.io/agentprose-demo/"
locale = "en-US"
title = "Agentic Engineering in Action (agentprose demo)"
enableRobotsTXT = true
disableKinds = []
summaryLength = 40

[params]
  description = "Demo blog for agentprose: real issues of Maxim Salnikov's LinkedIn newsletter Agentic Engineering in Action, served to AI agents through WebMCP."
  author = "Maxim Salnikov"
  authorUrl = "https://www.linkedin.com/in/webmax/"
  newsletter = "https://www.linkedin.com/newsletters/agentic-engineering-in-action-6864516245006376960/"
  library = "agentprose"
  libraryRepo = "https://github.com/vibeprogrammer/agentprose"
  demoRepo = "https://github.com/vibeprogrammer/agentprose-demo"

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/posts/:contentbasename/"

[outputFormats.llms]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[outputs]
  home = ["HTML", "RSS", "llms"]

[sitemap]
  changeFreq = "weekly"

[markup.goldmark.renderer]
  unsafe = false
[markup.highlight]
  noClasses = true
  style = "github"

[menus]
  [[menus.main]]
    name = "Posts"
    pageRef = "/"
    weight = 1
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 2
  [[menus.main]]
    name = "About"
    pageRef = "/about"
    weight = 3
